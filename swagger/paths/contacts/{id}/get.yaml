tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Get detailed information about a specific contact by its ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 653d16b5a3e4a51362e549b4
    description: Unique ID of the contact
responses:
  '200':
    description: Successfully found contact!
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 653d16b5a3e4a51362e549b4!
            data:
              $ref: '../../../../components/Contact.yaml'
  '401':
    description: Unauthorized
  '404':
    description: Contact not found
