tags:
  - Contacts
summary: Update contact by ID
operationId: updateContact
description: Partially update an existing contact by its ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 653d16b5a3e4a51362e549b4
    description: Unique ID of the contact
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Nur Seda Ağgünlü
          phoneNumber:
            type: string
            example: '+905559876543'
          email:
            type: string
            example: seda@example.com
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Successfully patched a contact!
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '../../../../components/Contact.yaml'
  '400':
    description: Validation error
  '401':
    description: Unauthorized
  '404':
    description: Contact not found
